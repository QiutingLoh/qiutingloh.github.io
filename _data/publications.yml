# To add one, copy a block and fill it in. Fields:
#   authors  - full author string; "Loh Q" is bolded automatically
#   title    - article title, no trailing period
#   venue    - journal or book, rendered in italics
#   detail   - volume/pages/article number
#   year     - used for the year badge and for sorting by hand
#   pdf      - optional, e.g. /files/pubs/2018-biotechniques.pdf
#   doi      - optional, bare DOI like 10.2144/btn-2018-0072
#   url      - optional, publisher/other link if there is no DOI
# Any of pdf/doi/url that you leave blank simply won't render a button.

