research_interests:
  summary: >-
    My research interests span antibody engineering and discovery, tumor cell
    biology, and molecular diagnostics. I am particularly interested in
    combining wet-lab antibody engineering with emerging high-throughput and
    computational approaches to advance therapeutic antibody development.
  areas:
    - title: "Antibody Engineering &amp; Discovery"
      body: >-
        Phage display, Fab presentation, antibody library construction and
        chain shuffling, including chaperone coplasmid systems that improve
        display on the phage surface.
    - title: "Tumor Cell Biology"
      body: >-
        Pancreatic cancer cell metabolism, metabolic flux analysis, and
        cell-based models spanning molecular biology, biochemistry, and cell
        biology.
    - title: "Molecular Diagnostics"
      body: >-
        DNAzyme and G-quadruplex reporter systems, isothermal nucleic acid
        amplification immunoassays, and rapid screening methods for
        enzymatic detection.

